<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AstroBridge | Mini Swap + Side Dashboard</title>
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/astrobridge-mark-256.png">
  <link rel="alternate icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="/vendor/tailwindcss/3.4.17/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'genesis-blue': '#40c4ff',
            'genesis-purple': '#7c4dff',
            'void-black': '#02000d',
          }
        }
      }
    }
  </script>
  <link href="/vendor/fonts/orbitron/5.3.0/font.css" rel="stylesheet">
  <script src="/vendor/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body{background:#02000d;min-height:100vh;position:relative;overflow-x:hidden;}
    /* 全屏悬浮粒子背景 */
    #particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
    /* 高透高亮立体玻璃升级，立体感+强光外发光 */
    .glass-sm{
      background:rgba(8,15,40,0.25);
      backdrop-filter:blur(20px);
      border:1px solid rgba(64,196,255,0.45);
      border-radius:1.2rem;
      box-shadow: 0 0 25px rgba(64,196,255,0.35),
                  inset 0 0 15px rgba(64,196,255,0.15);
      transform:translateZ(8px);
    }
    .btn-swap{
      background:linear-gradient(135deg,#40c4ff,#7c4dff);
      box-shadow:0 0 20px rgba(64,196,255,0.6);
      border-radius:0.8rem;
    }
    .btn-swap:hover{
      box-shadow:0 0 40px rgba(64,196,255,0.9);
      transform:scale(1.03) translateZ(12px);
    }
    .side-dash{width:280px;max-height:90vh;}
    .num-live{animation:pulse-num 1.2s infinite;}
    @keyframes pulse-num{0%,100%{opacity:1;}50%{opacity:0.7;}}
    /* 粒子闪烁动画 */
    @keyframes particle-float{
      0%{transform:translateY(0) translateX(0);opacity:0.2;}
      50%{transform:translateY(-15px) translateX(8px);opacity:0.8;}
      100%{transform:translateY(0) translateX(0);opacity:0.2;}
    }
    .particle{
      position:absolute;background:#40c4ff;border-radius:50%;
      animation:particle-float 6s ease-in-out infinite;
    }
    /* 核心修复：下拉框原生选项深色透明，干掉白色背景 */
    select {
      background-color: transparent !important;
      color: #fff !important;
      border-color: rgba(64,196,255,0.5) !important;
    }
    select option {
      background: #02000d !important;
      color: #fff !important;
    }
  </style>
</head>
<body class="flex items-start justify-center gap-4 p-6 font-sans flex-wrap relative z-10">
<!-- 全屏悬浮粒子画布 -->
<div id="particles"></div>

<!-- 左侧：带Logo顶部 + 立体高亮兑换主窗口 -->
<div class="glass-sm p-5 w-full max-w-md">
  <!-- 修复img标签语法错误，适配Logo路径 -->
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center gap-2">
      <img src="/assets/astrobridge-mark-256.png" alt="AstroBridge Logo" class="h-9 w-8 object-contain">
      <h1 class="text-xl font-orbitron text-genesis-blue">Astro Mini Swap</h1>
    </div>
    <button id="connBtn" class="btn-swap px-3 py-1.5 rounded-lg text-sm">Connect</button>
  </div>

  <div class="mb-3">
    <div class="flex justify-between text-xs text-gray-200 mb-1"><span>From</span><span>Preview • No balance loaded</span></div>
    <div class="flex gap-2">
      <!-- 全透明下拉、宽度w-2/5统一 -->
     <select class="bg-transparent border border-genesis-blue/50 rounded-lg p-2 text-sm text-white w-2/5">
        <option value="56" selected>BSC</option>
        <option value="1">Ethereum</option>
        <option value="137">Polygon</option>
        <option value="42161">Arbitrum One</option>
        <option value="43114">Avalanche C-Chain</option>
        <option value="8453">Base</option>
      </select>
      <input type="text" placeholder="0.00" class="bg-void-black/80 border border-genesis-blue/50 rounded-lg p-2 text-white w-3/5 text-right">
    </div>
  </div>

  <div class="flex justify-center my-2"><button class="p-2 rounded-full border border-genesis-blue/60 text-genesis-blue shadow-lg shadow-genesis-blue/40">⇅</button></div>

  <div class="mb-4">
    <div class="flex justify-between text-xs text-gray-200 mb-1"><span>To</span></div>
    <div class="flex gap-2">
      <!-- To端下拉同样全透明统一样式 -->
 <select class="bg-transparent border border-genesis-blue/50 rounded-lg p-2 text-sm text-white w-2/5">
        <option value="56">BSC</option>
        <option value="1" selected>Ethereum</option>
        <option value="137">Polygon</option>
        <option value="42161">Arbitrum One</option>
        <option value="43114">Avalanche C-Chain</option>
        <option value="8453">Base</option>
      </select>
      <input type="text" placeholder="Receive Address" class="bg-void-black/80 border border-genesis-blue/50 rounded-lg p-2 text-white w-3/5 text-right font-mono text-xs">
    </div>
  </div>

  <div class="text-xs text-gray-200 mb-4 flex justify-between"><span>Local preview • No quote</span><span class="text-genesis-blue font-bold">Mini Cross-Chain</span></div>
  <button id="sendBtn" class="btn-swap w-full py-3 rounded-xl font-medium disabled:opacity-40 disabled:cursor-not-allowed">Preview Transfer</button>

  <div class="glass-sm p-3 mt-4 max-h-28 overflow-y-auto text-xs font-mono text-gray-100" id="miniLog"></div>
</div>

<!-- 右侧高亮立体仪表盘 -->
<div class="glass-sm side-dash p-4 sticky top-6">
  <div class="flex items-center justify-center gap-2 mb-4 border-b border-genesis-blue/30 pb-2">
    <img src="/assets/astrobridge-mark-256.png" alt="Logo" class="h-7 w-6 object-contain">
    <h2 class="text-base font-orbitron text-genesis-blue">Network Status</h2>
  </div>

  <div class="space-y-4 text-sm">
    <div class="flex justify-between"><span class="text-gray-200">Health Nodes</span><span id="liveNodes" class="text-green-400 num-live font-orbitron">Unavailable</span></div>
    <div class="flex justify-between"><span class="text-gray-200">Queue Waiting</span><span id="liveQueue" class="text-genesis-blue font-orbitron">Unavailable</span></div>
    <div class="flex justify-between"><span class="text-gray-200">Success Rate</span><span id="liveRate" class="text-green-400 font-orbitron">Unavailable</span></div>
  </div>

  <div class="mt-4 pt-3 border-t border-genesis-blue/30">
    <p class="text-xs text-gray-200 mb-2">Recent Tx Hash — no live feed</p >
    <div id="txRoll" class="text-xs font-mono text-gray-100 max-h-32 overflow-y-auto break-all"></div>
  </div>
</div>

<script>
// 自动生成全屏悬浮科幻粒子
(function createParticles(){
  const wrap = document.getElementById('particles');
  const count = 94;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='particle';
    let s = Math.random()*4+1;
    p.style.width = s+'px';p.style.height=s+'px';
    p.style.left = Math.random()*100+'%';
    p.style.top = Math.random()*100+'%';
    p.style.animationDelay = Math.random()*6+'s';
    wrap.appendChild(p);
  }
})();

let userAddress = null;
const miniLog = document.getElementById('miniLog');
function logTxt(s){ miniLog.textContent += `> ${s}\n`; miniLog.scrollTop=miniLog.scrollHeight; }

document.getElementById('connBtn').onclick = async () => {
  if (!window.ethereum) return logTxt('No EVM wallet detected');
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    userAddress = accounts[0];
    if (!userAddress) return logTxt('No wallet account selected');
    document.getElementById('connBtn').textContent = userAddress.slice(0,6)+'...';
    logTxt('Wallet connected for account display only.');
  } catch (error) { logTxt('Wallet connection was not completed.'); }
};

document.getElementById('sendBtn').onclick = () => {
  const [fromChain, toChain] = document.querySelectorAll('select');
  const [amountInput, addressInput] = document.querySelectorAll('input');
  const amount = amountInput.value.trim();
  const address = addressInput.value.trim();
  if (!/^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$/.test(amount) || !Number.isFinite(Number(amount)) || Number(amount) <= 0 || !/^0x[0-9a-fA-F]{40}$/.test(address)) {
    return logTxt('Enter an amount greater than zero and a valid EVM recipient address.');
  }
  logTxt(`Local preview: ${fromChain.selectedOptions[0].textContent} → ${toChain.selectedOptions[0].textContent}; amount ${amount}; recipient ${address}.`);
  logTxt('Route, asset and quote require validation before live execution. No signature or transaction was requested.');
};

document.getElementById('txRoll').textContent = 'No verified transaction feed is connected.';
logTxt('Local interface preview. Six EVM selections do not guarantee live route availability.');
</script>
</body>
</html>
