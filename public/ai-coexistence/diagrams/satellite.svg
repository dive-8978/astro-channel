<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Satellite defense: a hypothesis to examine</title><desc id="desc">Unproven: hardware-free persistence, universal fragment detection and selective electromagnetic erasure.</desc><rect width="1200" height="600" fill="#09111a"/><style>text{font-family:Arial,sans-serif;fill:#edf3f7}.muted{fill:#a4b9c7;font-size:15px}.cyan{fill:#87edeb}</style><text x="50" y="58" font-size="12" class="cyan">ASTROBRIDGE RESEARCH / WORKING PAPER</text><text x="50" y="110" font-size="30">Satellite defense: a hypothesis to examine</text><rect x="230" y="160" width="740" height="64" fill="#10232b" stroke="#548883" stroke-dasharray="5 5"/><text x="600" y="199" text-anchor="middle" font-size="15" class="cyan">SHARED HUMAN AUTHORIZATION — PROPOSED</text><path d="M600 225v38m-5-5 5 5 5-5" stroke="#87edeb" fill="none"/><rect x="50" y="280" width="250" height="150" fill="#0d1a24" stroke="#3a5965"/><text x="70" y="310" class="cyan" font-size="12">01</text><text x="70" y="345" font-size="19">Fragment hypothesis</text><text x="70" y="375" class="muted">Identify a physical carrier,</text><text x="70" y="397" class="muted">receiver and execution path.</text><path d="M301 355h27m-6-5 6 5-6 5" fill="none" stroke="#87edeb"/><rect x="330" y="280" width="250" height="150" fill="#0d1a24" stroke="#3a5965"/><text x="350" y="310" class="cyan" font-size="12">02</text><text x="350" y="345" font-size="19">Spectrum observation</text><text x="350" y="375" class="muted">Measure detection and false</text><text x="350" y="397" class="muted">positives on a controlled</text><text x="350" y="419" class="muted">link.</text><path d="M581 355h27m-6-5 6 5-6 5" fill="none" stroke="#87edeb"/><rect x="610" y="280" width="250" height="150" fill="#0d1a24" stroke="#3a5965"/><text x="630" y="310" class="cyan" font-size="12">03</text><text x="630" y="345" font-size="19">Resource admission</text><text x="630" y="375" class="muted">Require authorization at</text><text x="630" y="397" class="muted">receiving and compute nodes.</text><path d="M861 355h27m-6-5 6 5-6 5" fill="none" stroke="#87edeb"/><rect x="890" y="280" width="250" height="150" fill="#0d1a24" stroke="#3a5965"/><text x="910" y="310" class="cyan" font-size="12">04</text><text x="910" y="345" font-size="19">Controlled test</text><text x="910" y="375" class="muted">Compare against endpoint</text><text x="910" y="397" class="muted">controls; report</text><text x="910" y="419" class="muted">limitations.</text><text x="50" y="487" class="muted">Unproven: hardware-free persistence, universal fragment detection and selective electromagnetic erasure.</text><text x="50" y="565" font-size="11" class="cyan">HYPOTHESIS → MECHANISM → CONTROLLED TEST → MEASURED EVIDENCE → REVISED CLAIM</text></svg>